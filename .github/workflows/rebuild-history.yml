name: Rebuild history

# Finished years do not change, so this is on demand plus one run a year, in
# mid-August, once the year just closed has settled in the dashboard's archive.
# build_all.py rebuilds both documents anyway, so this is a superset of the
# weekly refresh rather than a different job.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 15 8 *"     # 17:00 UTC, 15 August

concurrency:
  group: site-data            # every job writes docs/ and pushes; one at a time
  cancel-in-progress: false

env:
  UV_LOCKED: "1"            # fail if uv.lock is out of step with pyproject.toml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Run the tests
        # Saved fixtures only, so a parser broken by a change here fails in
        # seconds rather than after a full rebuild.
        run: |
          for t in scripts/test_*.py; do
            echo "== $t"
            uv run python "$t" || exit 1
          done

      - name: Refresh the district list
        run: uv run python scripts/districts.py

      - name: Rebuild every district, every year
        run: uv run python scripts/build_all.py

      - name: Link clubs across districts
        run: uv run python scripts/crosslink.py

      - name: Re-stamp the asset versions
        run: uv run python scripts/stamp_assets.py

      - name: Refuse a run that lost too many districts
        run: |
          uv run python - <<'PY'
          import json,sys
          d=json.load(open('docs/districts.json'))['districts']
          thin=[k for k,v in d.items() if not v.get('clubs')]
          print(f"{len(d)} districts, {len(thin)} with no live clubs: {thin}")
          if len(thin) > max(1, len(d)//10):
              sys.exit("too many districts came back empty - refusing to commit")
          PY

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "the archive has not moved since the last run; nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild district history for $(date -u +'%B %Y')"
          git push

      - name: Fail if any district was not refreshed
        # After the push, so the data still publishes and the job goes red.
        run: uv run python scripts/check_fresh.py
